
name: ModBridge APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract ModBridge ZIP
        run: |
          test -f ModBridge.zip
          mkdir -p /tmp/modbridge-unpack
          unzip -q ModBridge.zip -d /tmp/modbridge-unpack
          test -f /tmp/modbridge-unpack/ModBridge/settings.gradle.kts
          rsync -a --exclude='.github/' /tmp/modbridge-unpack/ModBridge/ ./

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and run tests
        run: gradle test assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModBridge-AxelzeroX23-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
